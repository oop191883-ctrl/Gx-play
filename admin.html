<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>GXPLAY Admin</title>
<style>
:root{--bg:#0d1620;--card:#15212e;--line:#22344a;--tx:#e8f1f8;--mu:#8aa4b8;--ac:#1a78ea;--ok:#2fd67f;--bad:#ff6b6b;--warn:#ffb648}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:#0a121a;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{font-size:18px}main{padding:14px 16px;max-width:1000px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a121a;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 2px;font-size:11px;position:relative}nav button span{display:block;font-size:19px}nav button.on{color:var(--ac)}
.badge{position:absolute;top:4px;left:55%;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat small{color:var(--mu);display:block}.stat b{font-size:22px}
input,select,textarea{width:100%;background:#0d1620;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600}button.g{background:#2a3d52}button.r{background:var(--bad)}button.o{background:var(--ok);color:#04210f}button.b:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border:0}
.row small{color:var(--mu);display:block;word-break:break-all}.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:#2a3d52}.tag.ok{background:#12492b;color:var(--ok)}.tag.bad{background:#5a1f1f;color:var(--bad)}.tag.warn{background:#5a4211;color:var(--warn)}
.flex{display:flex;gap:8px;flex-wrap:wrap}.flex>*{flex:1}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}@media(min-width:700px){#modal{align-items:center}}
#mbox{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}@media(min-width:700px){#mbox{border-radius:16px}}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;display:none;max-width:90%;text-align:center}
h3{margin:0 0 10px}code{word-break:break-all;color:#9fd0ff}.err{color:var(--bad);min-height:18px;font-size:13px}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
</style></head><body>
<div id="toast"></div><div id="app"></div><div id="modal" onclick="if(event.target===this)closeM()"><div id="mbox"></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=t=>t?new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—',inr=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
async function api(m,p,b){const r=await fetch('/admin/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:m==='GET'?undefined:JSON.stringify(b||{})});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='/login'){showLogin();throw new Error('login')}if(!r.ok)throw new Error(j.error||'Error');return j}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
async function act(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){if(e.message!=='login')toast('⚠ '+e.message);return false}}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.25)}catch(e){}}
function showLogin(){clearInterval(poll);$('app').innerHTML=`<div id="login"><h2>GXPLAY Admin</h2><label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div class="err" id="le"></div><button class="b" style="width:100%" onclick="doLogin()">Login</button></div>`}
async function doLogin(){try{await api('POST','/login',{username:$('lu').value,password:$('lp').value});boot()}catch(e){$('le').textContent=e.message}}
let tab='dash',last={u:null,d:null,w:null},pend=0,pendW=0,poll,newU=0;
const TABS=[['dash','📊','Home'],['users','👥','Users'],['deps','💰','Deposits'],['wds','💸','Withdraw'],['addr','🏦','Addresses'],['more','⚙️','More']];
function shell(){$('app').innerHTML=`<header><b>GXPLAY Admin</b><button class="b g" onclick="api('POST','/logout').then(showLogin)">Logout</button></header><main id="main"></main><nav>${TABS.map(t=>`<button id="t_${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`}
function go(t){tab=t;if(t==='users')newU=0;TABS.forEach(x=>$('t_'+x[0]).classList.toggle('on',x[0]===t));badges();({dash,users,deps,wds,addr,more})[t]()}
function badges(){const set=(t,n)=>{const b=$('t_'+t);if(!b)return;b.querySelector('.badge')?.remove();if(n)b.insertAdjacentHTML('beforeend',`<i class="badge">${n}</i>`)};set('users',newU);set('deps',pend);set('wds',pendW)}
async function tick(){try{const s=await api('GET','/summary');
 if(last.u!==null&&s.lastUser>last.u){const n=s.recent.filter(u=>u.id>last.u);newU+=n.length;toast('🆕 New registration: '+n.map(u=>u.name).join(', '));beep();document.title='('+newU+') GXPLAY Admin';if(tab==='users')users();}
 if(last.d!==null&&s.lastDep>last.d){toast('💰 New deposit request');beep();if(tab==='deps')deps()}
 if(last.w!==null&&s.lastWd>last.w){toast('💸 New withdrawal request');beep();if(tab==='wds')wds()}
 last={u:s.lastUser,d:s.lastDep,w:s.lastWd};pend=s.pending;pendW=s.pendingW;badges();if(tab==='dash')dash(s)}catch(e){}}
async function boot(){try{await api('GET','/summary')}catch(e){return showLogin()}shell();last={u:null,d:null,w:null};await tick();go(tab);clearInterval(poll);poll=setInterval(tick,8000)}
async function dash(s){s=s||await api('GET','/summary');if(tab!=='dash')return;$('main').innerHTML=`<div class="grid">${[['Total users',s.users],['Today new',s.today],['Pending deposits',s.pending],['Pending withdrawals',s.pendingW],['Total user balance',inr(s.totalBal)],['Approved deposits',inr(s.approved)],['Paid out',inr(s.paidOut)],['Blocked',s.blocked]].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="card"><h3>Latest registrations</h3>${s.recent.map(u=>`<div class="row" onclick="userM(${u.id})"><div>${esc(u.name)}<small>${esc(u.email)}</small></div><small>${fd(u.created)}</small></div>`).join('')||'<small>None yet</small>'}</div><small style="color:var(--mu)">Auto-refreshes every 8s. Naya user register hote hi alert + beep aayega (page khula rakhein).</small>`}
async function users(){$('main').innerHTML=`<input id="uq" placeholder="🔍 Search name / email / referral code" oninput="clearTimeout(users.t);users.t=setTimeout(usersList,250)"><div class="flex" style="margin-bottom:10px"><a href="/admin/api/export.csv" style="flex:0"><button class="b g">⬇ CSV</button></a></div><div class="card" id="ul"></div>`;usersList()}
async function usersList(){const r=await api('GET','/users?q='+encodeURIComponent($('uq')?.value||''));if(!$('ul'))return;$('ul').innerHTML=r.users.map(u=>`<div class="row" onclick="userM(${u.id})"><div>${esc(u.name)} ${u.blocked?'<span class="tag bad">blocked</span>':''}<small>${esc(u.email)} · joined ${fd(u.created)}</small></div><b>${inr(u.bal)}</b></div>`).join('')||'<small>No users</small>'}
function closeM(){$('modal').style.display='none'}function openM(h){$('mbox').innerHTML=h;$('modal').style.display='flex'}
async function userM(id){const r=await api('GET','/users/'+id),u=r.user;window._u=u;
 openM(`<h3>${esc(u.name)} <small style="color:var(--mu)">#${u.id}</small></h3>
 <label>Username</label><input id="mn" value="${esc(u.name)}"><label>Email</label><input id="me" value="${esc(u.email)}"><label>Balance (₹)</label><input id="mb" type="number" step="0.01" value="${u.bal}">
 <label>Admin note</label><textarea id="mo" rows="2">${esc(u.note)}</textarea><label><input type="checkbox" id="mk" ${u.blocked?'checked':''} style="width:auto;margin:0 6px 0 0">Block this user</label>
 <div class="flex" style="margin-top:12px"><button class="b" onclick="saveU(${id})">Save changes</button></div>
 <div class="card" style="margin-top:14px"><label>Quick add / remove balance (use − for remove)</label><div class="flex"><input id="md" type="number" step="0.01" placeholder="e.g. 500 or -200"><input id="mr" placeholder="Reason"></div><button class="b o" onclick="adjU(${id})">Apply</button></div>
 <div class="card"><label>Reset password (min 8)</label><input id="mp" placeholder="New password"><button class="b g" onclick="pwU(${id})">Reset password</button></div>
 <div class="card"><h3>User's crypto addresses</h3>${r.addrs.map(a=>`<div style="margin-bottom:8px"><b>${esc(a.coin)}/${esc(a.network)}</b><br><code>${esc(a.address)}</code></div>`).join('')||'<small>None saved</small>'}
 <label>Set / change address (leave address empty to delete)</label><div class="flex"><input id="ac" placeholder="Coin" value="USDT"><input id="an" placeholder="Network" value="TRX"></div><input id="aa" placeholder="Address"><button class="b g" onclick="addrU(${id})">Save address</button></div>
 <div class="card"><h3>Info</h3><small>Joined ${fd(u.created)} · Last login ${fd(u.last_login)}<br>IP ${esc(u.ip)}<br>Own code <code>${esc(u.code)}</code> · Referred by ${esc(u.ref_by||'—')} · Friends: ${r.referred.map(x=>esc(x.name)).join(', ')||'0'}<br>Bets ${u.bets} / Wins ${u.wins}<br>Verification: <code>${esc(JSON.stringify(u.verif))}</code></small></div>
 <div class="card"><h3>Withdrawals</h3>${(r.withdrawals||[]).map(d=>`<div class="row" style="cursor:default"><div>${inr(d.amount)} ${esc(d.coin)}/${esc(d.network)}<small>${esc(d.address)}</small></div><span class="tag ${d.status==='approved'?'ok':d.status==='rejected'?'bad':'warn'}">${d.status}</span></div>`).join('')||'<small>None</small>'}</div>
 <div class="card"><h3>Deposits</h3>${r.deposits.map(d=>`<div class="row" style="cursor:default"><div>${inr(d.amount)} ${esc(d.coin)}/${esc(d.network)}<small>${esc(d.tx_hash)}</small></div><span class="tag ${d.status==='approved'?'ok':d.status==='rejected'?'bad':'warn'}">${d.status}</span></div>`).join('')||'<small>None</small>'}</div>
 <div class="flex"><button class="b r" onclick="delU(${id})">Delete user</button><button class="b g" onclick="closeM()">Close</button></div>`)}
const rf=()=>{tab==='users'?usersList():tab==='dash'?dash():0};
const saveU=id=>act(async()=>{await api('PATCH','/users/'+id,{name:$('mn').value,email:$('me').value,bal:$('mb').value,note:$('mo').value,blocked:$('mk').checked});closeM();rf()},'Saved');
const adjU=id=>act(async()=>{await api('POST','/users/'+id+'/balance',{delta:$('md').value,reason:$('mr').value});await userM(id);rf()},'Balance updated');
const pwU=id=>act(async()=>{await api('POST','/users/'+id+'/password',{password:$('mp').value});$('mp').value=''},'Password reset');
const addrU=id=>act(async()=>{await api('PUT','/users/'+id+'/address',{coin:$('ac').value,network:$('an').value,address:$('aa').value});await userM(id)},'Address saved');
const delU=id=>confirm('Permanently delete this user?')&&act(async()=>{await api('DELETE','/users/'+id);closeM();rf()},'Deleted');
let depF='pending';
async function deps(){const r=await api('GET','/deposits?status='+depF);if(tab!=='deps')return;$('main').innerHTML=`<div class="flex" style="margin-bottom:10px">${['pending','approved','rejected',''].map(s=>`<button class="b ${s===depF?'':'g'}" onclick="depF='${s}';deps()">${s||'all'}</button>`).join('')}</div><div class="card">${r.deposits.map(d=>`<div class="row" style="cursor:default;align-items:flex-start"><div><b>${esc(d.name||'deleted')}</b> · ${inr(d.amount)}${d.disp_cur&&d.disp_cur!=='INR'?` <small style="display:inline">(user typed ${esc(d.disp_amount)} ${esc(d.disp_cur)})</small>`:''}<small>${esc(d.coin)}/${esc(d.network)} · ${fd(d.created)}</small><small>TX: ${esc(d.tx_hash)}</small></div>${d.status==='pending'?`<div style="display:grid;gap:6px"><button class="b o" onclick="decide(${d.id},'approve',${d.amount})">Approve</button><button class="b r" onclick="decide(${d.id},'reject')">Reject</button></div>`:`<span class="tag ${d.status==='approved'?'ok':'bad'}">${d.status}</span>`}</div>`).join('')||'<small>Nothing here</small>'}</div>`}
let wdF='pending';
async function wds(){const r=await api('GET','/withdrawals?status='+wdF);if(tab!=='wds')return;$('main').innerHTML=`<div class="flex" style="margin-bottom:10px">${['pending','approved','rejected',''].map(s=>`<button class="b ${s===wdF?'':'g'}" onclick="wdF='${s}';wds()">${s||'all'}</button>`).join('')}</div><div class="card">${r.withdrawals.map(w=>`<div class="row" style="cursor:default;align-items:flex-start"><div><b>${esc(w.name||'deleted')}</b> · ${inr(w.amount)}${w.disp_cur&&w.disp_cur!=='INR'?` <small style="display:inline">(user typed ${esc(w.disp_amount)} ${esc(w.disp_cur)})</small>`:''}<small>${esc(w.coin)}/${esc(w.network)} · ${fd(w.created)}</small><small>Send to: <code>${esc(w.address)}</code></small>${w.tx_hash?`<small>Payout TX: ${esc(w.tx_hash)}</small>`:''}${w.admin_note?`<small>Note: ${esc(w.admin_note)}</small>`:''}</div>${w.status==='pending'?`<div style="display:grid;gap:6px"><button class="b o" onclick="decideW(${w.id},'approve')">Paid ✓</button><button class="b r" onclick="decideW(${w.id},'reject')">Reject</button></div>`:`<span class="tag ${w.status==='approved'?'ok':'bad'}">${w.status==='approved'?'paid':w.status}</span>`}</div>`).join('')||'<small>Nothing here</small>'}</div><small style="color:var(--mu)">Amount is already held from the user's balance. "Paid" = you sent the crypto (enter its TXID). "Reject" returns the amount to the user's balance.</small>`}
const decideW=(id,w)=>{let tx='',note='';if(w==='approve'){const t=prompt('Payout transaction ID (TXID) - optional, user will see it in history','');if(t===null)return;tx=t}else{const n=prompt('Reason for rejecting (shown to user, optional). Amount will be refunded.','');if(n===null)return;note=n}
 act(async()=>{await api('POST',`/withdrawals/${id}/${w}`,{txHash:tx,note});tick();wds()},w==='approve'?'Marked as paid':'Rejected & refunded')};
const decide=(id,w,a)=>{let amt;if(w==='approve'){amt=prompt('Amount to credit (₹)',a);if(amt===null)return}else if(!confirm('Reject this deposit?'))return;act(async()=>{await api('POST',`/deposits/${id}/${w}`,{amount:amt});tick();deps()},w==='approve'?'Approved & balance added':'Rejected')};
async function addr(){const r=await api('GET','/deposit-addresses');$('main').innerHTML=`<div class="card"><h3>Deposit addresses (website par users ko yahi dikhega)</h3>${r.list.map(a=>`<div class="row" style="cursor:default"><div><b>${esc(a.coin)} · ${esc(a.network)}</b><small>${esc(a.address)}</small></div><div class="flex" style="flex:0"><button class="b g" onclick="$('dc').value='${esc(a.coin)}';$('dn').value='${esc(a.network)}';$('da').value='${esc(a.address)}';scrollTo(0,9999)">Edit</button><button class="b r" onclick="delAddr('${esc(a.coin)}','${esc(a.network)}')">✕</button></div></div>`).join('')||'<small>No address set. Neeche se add karein.</small>'}</div>
<div class="card"><h3>Add / change address</h3><div class="flex"><div><label>Coin</label><input id="dc" placeholder="USDT"></div><div><label>Network</label><input id="dn" placeholder="TRX"></div></div><label>Wallet address</label><input id="da"><button class="b" onclick="saveAddr()">Save</button><small style="color:var(--mu)">Same coin+network dubara save karne par address badal jaata hai. Naya address turant website par live ho jaata hai.</small></div>`}
const saveAddr=()=>act(async()=>{await api('PUT','/deposit-addresses',{coin:$('dc').value,network:$('dn').value,address:$('da').value});addr()},'Address updated');
const delAddr=(c,n)=>confirm('Remove '+c+'/'+n+'?')&&act(async()=>{await api('DELETE','/deposit-addresses',{coin:c,network:n});addr()},'Removed');
async function more(){const [s,l]=await Promise.all([api('GET','/settings'),api('GET','/logs')]);$('main').innerHTML=`<div class="card"><h3>Telegram alert (optional)</h3><small style="color:var(--mu)">Phone par turant message: BotFather se bot banayein, token + chat id daalein. Page band ho tab bhi alert aayega.</small><label>Bot token</label><input id="tt" value="${esc(s.tg_token)}" placeholder="123456:ABC..."><label>Chat ID</label><input id="tc" value="${esc(s.tg_chat)}"><div class="flex"><button class="b" onclick="saveTg()">Save</button><button class="b g" onclick="act(()=>api('POST','/test-notify'),'Sent test')">Test</button></div></div>
<div class="card"><h3>Withdraw page ka extra note</h3><small style="color:var(--mu)">Ye text withdraw page par standard chetavni ke neeche dikhega (fees, processing time, support jaisi info). Max 600 akshar. Khali chhodo to kuch extra nahi dikhega.</small><label>Main line (khali = default)</label><textarea id="wm" rows="3" style="width:100%" placeholder="Withdrawals are sent manually after review. The amount is held from your balance right away, and returned to it if the request is rejected.">${esc(s.wd_main||'')}</textarea><small style="color:var(--mu)">"Check the address and network carefully: crypto transfers cannot be reversed." har haal me is line ke baad jud kar dikhegi.</small><label>Extra note</label><textarea id="wn" rows="4" style="width:100%">${esc(s.wd_note||'')}</textarea><button class="b" onclick="saveWn()">Save</button></div>
<div class="card"><h3>Help &amp; Support info</h3><small style="color:var(--mu)">Website ke Help &amp; Support page par users ko ye dikhega (jaise Telegram / WhatsApp / email). Max 600 akshar.</small><textarea id="st" rows="3" maxlength="600" placeholder="Telegram: @yoursupport&#10;Email: support@yoursite.com">${esc(s.support_text)}</textarea><button class="b" onclick="saveSup()">Save</button></div>
<div class="card"><h3>"Game unavailable" message</h3><small style="color:var(--mu)">Jab user lock wale game par tap karega to ye title aur message dikhega. Khali chhodo to default dikhega.</small><label>Title</label><input id="lt" maxlength="60" placeholder="Game unavailable" value="${esc(s.lock_title)}"><label>Message (max 400 akshar)</label><textarea id="lm" rows="3" maxlength="400" placeholder="This game is currently unavailable. Please try again later.">${esc(s.lock_msg)}</textarea><button class="b" onclick="saveLock()">Save</button></div>
<div class="card"><h3>Admin login badlein</h3><label>Username</label><input id="cu" value="${esc(s.admin)}"><label>Current password</label><input id="cp" type="password"><label>New password (min 8)</label><input id="cn" type="password"><button class="b" onclick="chPw()">Update</button></div>
<div class="card"><h3>Activity log</h3>${l.logs.map(x=>`<div class="row" style="cursor:default"><div>${esc(x.action)} <small>${esc(x.actor)} — ${esc(x.detail)}</small></div><small>${fd(x.ts)}</small></div>`).join('')}</div>`}
const saveSup=()=>act(()=>api('PUT','/settings',{support_text:$('st').value}),'Saved - website par turant live');
const saveLock=()=>act(()=>api('PUT','/settings',{lock_title:$('lt').value,lock_msg:$('lm').value}),'Saved - website par turant live');
const saveWn=()=>act(()=>api('PUT','/settings',{wd_note:$('wn').value,wd_main:$('wm').value}),'Saved');
const saveTg=()=>act(()=>api('PUT','/settings',{tg_token:$('tt').value,tg_chat:$('tc').value}),'Saved');
const chPw=()=>act(async()=>{await api('POST','/change-password',{username:$('cu').value,current:$('cp').value,password:$('cn').value});$('cp').value=$('cn').value=''},'Updated');
boot();
</script></body></html>
